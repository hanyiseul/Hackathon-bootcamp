<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="post-container">
    <h1 class="logo">MiniSNS</h1>

    <form th:action="@{/edit/{id}(id=${post.id})}" method="post">
        <div class="form-group">
            <textarea name="content" th:text="${post.content}"></textarea>
        </div>
        <button type="submit" class="signup-btn">수정하기</button>
    </form>
</div>

</body>
</html>
